<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Font Pairings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..700,0..100&family=Inter:wght@400..700&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400..600&family=Public+Sans:wght@400..700&family=Instrument+Serif&family=Inter+Tight:wght@400..700&family=Source+Serif+4:opsz,wght@8..60,400..600&family=Source+Sans+3:wght@400..700&display=swap">
<style>
  :root {
    --bg: #17130f;
    --card: #201b16;
    --fg: #ece3d3;
    --muted: color-mix(in srgb, #ece3d3 62%, #17130f);
    --accent: #c2cf7a;
    --series: #829c35;
    --rule: #3d352b;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f3ede2;
    --card: #faf6ee;
    --fg: #2a221b;
    --muted: color-mix(in srgb, #2a221b 62%, #f3ede2);
    --accent: #5a6b1f;
    --series: #6f8a2a;
    --rule: #d4c8b2;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 16px 64px;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.5 Inter, system-ui, sans-serif;
    transition: background-color 150ms, color 150ms;
  }
  main { max-width: 1080px; margin: 0 auto; }
  .intro { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 1rem; margin-bottom: 2rem; }
  .intro h1 { font: 400 2rem/1.15 Fraunces, Georgia, serif; margin: 0 0 0.35rem; }
  .intro p { margin: 0; color: var(--muted); max-width: 44rem; }
  .mode {
    font: 500 0.8rem Inter, sans-serif;
    border: 1px solid var(--rule);
    background: var(--card);
    color: var(--fg);
    padding: 0.35rem 0.8rem;
    border-radius: 999px;
    cursor: pointer;
  }

  .option { margin: 0 0 2.5rem; }
  .option-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.25rem 0.9rem; margin-bottom: 0.6rem; }
  .option-head .num { font: 600 0.72rem Inter, sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .option-head .names { font: 600 1rem Inter, sans-serif; }
  .option-head p { flex-basis: 100%; margin: 0; color: var(--muted); font-size: 0.9rem; }

  /* The mock: --display and --data are set per option. */
  .mock { border: 1px solid var(--rule); background: var(--bg); padding: 14px 18px 18px; }
  .mock-top { display: flex; justify-content: space-between; align-items: center; gap: 1rem; border-bottom: 1px solid var(--rule); padding-bottom: 8px; margin-bottom: 12px; }
  .mock h2 { font-family: var(--display); font-weight: var(--display-weight, 400); font-size: 1.7rem; line-height: 1.1; margin: 0; letter-spacing: var(--display-tracking, 0); }
  .label { font: 600 0.68rem/1.2 var(--data); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .slider { display: flex; align-items: center; gap: 8px; font: 0.8rem var(--data); color: var(--muted); }
  .slider i { display: block; width: 90px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--series) 60%, var(--rule) 60%); }
  .layout { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 14px; }
  @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }

  .birds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 6px; }
  .bird .ph { aspect-ratio: 4 / 3; border: 1px solid var(--rule); background: linear-gradient(135deg, color-mix(in srgb, var(--series) 35%, var(--card)), var(--card)); margin-bottom: 5px; }
  .bird .name { font-family: var(--display); font-weight: var(--display-weight, 400); font-size: 0.98rem; line-height: 1.2; }
  .bird .when { font: 600 0.75rem var(--data); }
  .bird .also { font: 0.72rem var(--data); color: var(--muted); }

  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
  .stat { background: var(--card); border: 1px solid var(--rule); border-top: 2px solid var(--fg); padding: 8px 10px; }
  .stat b { display: block; font: 600 1.45rem/1.15 var(--data); margin-top: 4px; font-variant-numeric: lining-nums; }
  .stat span { font: 0.72rem var(--data); color: var(--muted); }

  .panel { background: var(--card); border: 1px solid var(--rule); border-top: 2px solid var(--fg); padding: 10px 12px 12px; }
  .panel h3 { font-family: var(--display); font-weight: var(--display-weight, 400); font-size: 1.05rem; margin: 2px 0 2px; }
  .panel .desc { font: 0.78rem/1.45 var(--data); color: var(--muted); margin: 0 0 8px; }
  svg { display: block; width: 100%; height: auto; font-family: var(--data); }
  svg text { fill: var(--fg); font-size: 10px; }
  svg .faint { fill: var(--muted); }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font: 0.78rem var(--data); font-variant-numeric: tabular-nums; }
  th { text-align: left; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--rule); padding: 3px 0; }
  td { padding: 3px 0; border-bottom: 1px solid color-mix(in srgb, var(--rule) 60%, transparent); }
  td:last-child, th:last-child { text-align: right; }
  td a { color: var(--accent); text-decoration: none; }
  footer { color: var(--muted); font-size: 0.85rem; border-top: 1px solid var(--rule); padding-top: 1rem; }
</style>
</head>
<body>
<main>
  <div class="intro">
    <div>
      <h1>Font pairings</h1>
      <p>Serif for headings and bird names; sans for numbers, times, labels and chart text. Each option is shown on a mini dashboard in Cedar &amp; Olive. All are free Google Fonts.</p>
    </div>
    <button class="mode" type="button">Switch to light</button>
  </div>
  <div id="options"></div>
  <footer>Pick a number, or mix: any of these serifs works with any of these sans.</footer>
</main>

<script>
const OPTIONS = [
  {
    display: "Fraunces", data: "Inter",
    note: "Keeps today's soft, slightly quirky serif, with Inter for crisp, neutral numbers. The safest change from what's live now.",
    vars: {"--display": "Fraunces, Georgia, serif", "--data": "Inter, system-ui, sans-serif"}
  },
  {
    display: "Fraunces", data: "IBM Plex Sans",
    note: "Plex has an engineered, blueprint quality: the most \"architectural\" option for the data, with the same warm headings.",
    vars: {"--display": "Fraunces, Georgia, serif", "--data": "'IBM Plex Sans', system-ui, sans-serif"}
  },
  {
    display: "Newsreader", data: "Public Sans",
    note: "Editorial and field-journal-like: a sturdy reading serif over a plain, very legible sans. Calm and a bit more classic.",
    vars: {"--display": "Newsreader, Georgia, serif", "--data": "'Public Sans', system-ui, sans-serif", "--display-weight": 500}
  },
  {
    display: "Instrument Serif", data: "Inter Tight",
    note: "Tall, condensed, high-contrast headings over a compact sans. Most modern and magazine-like; fits more on screen.",
    vars: {"--display": "'Instrument Serif', Georgia, serif", "--data": "'Inter Tight', system-ui, sans-serif", "--display-tracking": "0.005em"}
  },
  {
    display: "Source Serif 4", data: "Source Sans 3",
    note: "A matched family designed to work together, like a well-made reference book. Quietest and most cohesive.",
    vars: {"--display": "'Source Serif 4', Georgia, serif", "--data": "'Source Sans 3', system-ui, sans-serif", "--display-weight": 500}
  }
];

const BIRDS = [["American Robin", "Today, 6:13 PM", "also 4:33 PM · 3:08 PM"], ["Pacific Wren", "Today, 5:21 PM", "also 5:01 PM · 4:45 PM"], ["Varied Thrush", "Today, 4:54 PM", "also 8:21 AM"]];
const ROWS = [["Dark-eyed Junco", [8, 9, 11, 12, 30, 34, 70, 74, 75, 92, 95]], ["House Finch", [10, 14, 17, 52, 53, 76, 90]], ["Pacific Wren", [12, 13, 15, 18, 20, 41, 60, 83, 85, 88]], ["Song Sparrow", [16, 19, 33, 38, 80, 81]], ["Steller's Jay", [44, 49, 58, 66, 79]]];
const DETECTIONS = [["6:13 PM", "American Robin", "82%"], ["5:58 PM", "House Finch", "78%"], ["5:43 PM", "Dark-eyed Junco", "85%"]];

const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs = {}, ...kids) {
  const n = tag === "svg" || ["line", "rect", "text", "g"].includes(tag) ? document.createElementNS(NS, tag) : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "style") for (const [p, val] of Object.entries(v)) n.style.setProperty(p, val);
    else n.setAttribute(k, v);
  }
  for (const k of kids) n.append(k);
  return n;
}

function raster() {
  const left = 104, width = 420, right = 24, rowH = 18, top = 18;
  const svg = el("svg", {viewBox: `0 0 ${width} ${top + ROWS.length * rowH + 22}`, role: "img", "aria-label": "Example timeline"});
  const x = (p) => left + (p / 100) * (width - left - right);
  for (const [p, label] of [[0, "8a"], [25, "11a"], [50, "2p"], [75, "5p"]]) {
    svg.append(el("line", {x1: x(p), x2: x(p), y1: top - 4, y2: top + ROWS.length * rowH, stroke: "var(--rule)"}));
    svg.append(el("text", {x: x(p), y: top + ROWS.length * rowH + 14, "text-anchor": "middle", class: "faint"}, label));
  }
  svg.append(el("text", {x: x(6), y: 10, "text-anchor": "middle", class: "faint"}, "sunrise 7:38a"));
  ROWS.forEach(([name, ticks], i) => {
    const y = top + i * rowH;
    svg.append(el("text", {x: left - 8, y: y + rowH / 2 + 3.5, "text-anchor": "end"}, name));
    for (const t of ticks) svg.append(el("rect", {x: x(t), y: y + 3, width: 1.6, height: rowH - 6, fill: "var(--series)"}));
    svg.append(el("text", {x: width - 4, y: y + rowH / 2 + 3.5, "text-anchor": "end", class: "faint"}, String(ticks.length * 4)));
  });
  return svg;
}

function mock(o) {
  const root = el("div", {class: "mock", style: o.vars});
  const birds = el("div", {class: "birds"}, ...BIRDS.map(([n, w, a]) => el("div", {class: "bird"}, el("div", {class: "ph"}), el("div", {class: "name"}, n), el("div", {class: "when"}, w), el("div", {class: "also"}, a))));
  const stats = el("div", {class: "stats"},
    ...[["Species heard", "48", "Oct 16 – Oct 22"], ["Detections", "1,837", "262 per day"], ["New this week", "1", "Cooper's Hawk"]]
      .map(([l, v, s]) => el("div", {class: "stat"}, el("div", {class: "label"}, l), el("b", {}, v), el("span", {}, s))));
  const table = el("table", {},
    el("thead", {}, el("tr", {}, el("th", {}, "Time"), el("th", {}, "Species"), el("th", {}, "Confidence"))),
    el("tbody", {}, ...DETECTIONS.map(([t, s, c]) => el("tr", {}, el("td", {}, t), el("td", {}, el("a", {href: "#"}, s)), el("td", {}, c)))));
  root.append(
    el("div", {class: "mock-top"}, el("h2", {}, "What's singing in the yard"), el("div", {class: "slider"}, el("span", {class: "label"}, "Min confidence"), "0.60", el("i"))),
    el("div", {class: "layout"},
      el("div", {}, el("div", {class: "label"}, "Recently heard"), birds, stats),
      el("div", {class: "panel"},
        el("div", {class: "label"}, "A day in the yard"),
        el("h3", {}, "When each bird was heard"),
        el("p", {class: "desc"}, "One tick per detection; darker ticks are more confident."),
        raster(),
        table
      )
    )
  );
  return root;
}

const host = document.getElementById("options");
OPTIONS.forEach((o, i) => {
  host.append(el("section", {class: "option"},
    el("div", {class: "option-head"},
      el("span", {class: "num"}, `Option ${i + 1}`),
      el("span", {class: "names"}, `${o.display} + ${o.data}`),
      el("p", {}, o.note)),
    mock(o)));
});

const btn = document.querySelector(".mode");
btn.addEventListener("click", () => {
  const light = document.documentElement.dataset.theme === "light";
  document.documentElement.dataset.theme = light ? "dark" : "light";
  btn.textContent = light ? "Switch to light" : "Switch to dark";
});
</script>
</body>
</html>
