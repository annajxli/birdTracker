# Build the dashboard and deploy it to Cloudflare as the password Worker's
# static assets (deploy/wrangler.toml), so the site is only reachable through
# the password. Runs on pushes to main that change what the site is built
# from (the paths below), weekly, and on demand from the Actions tab. The pages load the latest detections from the recorder's R2
# bucket and the last month of weather from Open-Meteo when they open, so new
# data never waits for a build; the weekly run only refreshes the copies built
# into the site (the fallbacks, and weather older than a month).
#
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (a token with the
# "Edit Cloudflare Workers" template) and CLOUDFLARE_ACCOUNT_ID.
#
# Detections come from the recorder: pipeline/publish.py uploads a database
# snapshot to the R2 bucket (and starts this workflow). Until a snapshot
# exists, the build simulates a year instead, and writes no sign-in chart.
# The API token needs R2 read access as well as Workers (docs/deploy.md).

name: Deploy dashboard

on:
  push:
    branches: [main]
    # The site's sources, and the Pi's code that the Hardware page compares
    # with (DEPLOYED in pipeline/code_version.py). Other changes, such as
    # documentation, don't deploy.
    paths:
      - "dashboard/**"
      - "pipeline/**"
      - "data/**"
      - "deploy/**"
      - "requirements-dashboard.txt"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "10 13 * * 1" # Mondays, 6am Pacific (daylight time)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

# One job: GitHub bills each job in whole minutes, so a separate deploy job
# would cost an extra minute per run.
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # history, for the pipeline commits the Hardware page compares with the Pi's

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      # The dashboard's data loaders run with ../.venv/bin/python (see observablehq.config.js).
      - name: Python environment
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet -r requirements-dashboard.txt

      # Weather first, so the simulated activity follows this year's real rain.
      - name: Update weather
        # Keeps the checked-in weather if Open-Meteo is unreachable.
        continue-on-error: true
        run: .venv/bin/python pipeline/weather.py

      - name: Detections
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes wrangler@4.152.0 r2 object get birdtracker-media/data/detections.sqlite \
              --file data/detections.sqlite --remote; then
            echo "Using the recorder's detections"
          else
            echo "No snapshot in R2 yet: simulating"
            rm -f data/detections.sqlite
            .venv/bin/python pipeline/simulate.py
          fi

      - name: Build site
        working-directory: dashboard
        env:
          OBSERVABLE_TELEMETRY_DISABLE: "true"
        run: |
          npm ci
          npm run build

      # The chart beside the password, written into the built site. Without it, the sign-in page
      # shows the password alone, so a failure here doesn't stop the deploy.
      - name: Sign-in chart
        continue-on-error: true
        run: .venv/bin/python pipeline/signin_chart.py

      - name: Deploy to Cloudflare
        working-directory: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.152.0 deploy
