# Build the dashboard and deploy it to Cloudflare as the password Worker's
# static assets (deploy/wrangler.toml), so the site is only reachable through
# the password. Runs on every push to main, daily (so "today" and the weather
# stay current), and on demand from the Actions tab.
#
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (a token with the
# "Edit Cloudflare Workers" template) and CLOUDFLARE_ACCOUNT_ID.
#
# Until the recorder is running, the detections are simulated here on each
# build; the database isn't in the repo.

name: Deploy dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 13 * * *" # 6am Pacific (daylight time)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      # The dashboard's data loaders run with ../.venv/bin/python (see observablehq.config.js).
      - name: Python environment
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet -r requirements-dashboard.txt

      # Weather first, so the simulated activity follows this year's real rain.
      - name: Update weather
        # Keeps the checked-in weather if Open-Meteo is unreachable.
        continue-on-error: true
        run: .venv/bin/python pipeline/weather.py

      - name: Simulate detections
        run: .venv/bin/python pipeline/simulate.py

      - name: Simulate recorder telemetry
        run: .venv/bin/python pipeline/simulate_recordings.py

      - name: Build site
        working-directory: dashboard
        env:
          OBSERVABLE_TELEMETRY_DISABLE: "true"
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: dashboard/dist
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site
          path: dashboard/dist

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Deploy to Cloudflare
        working-directory: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.152.0 deploy
