# The sign-in Worker, serving the built dashboard as its static assets.
# Deployed by .github/workflows/pages.yml; setup in docs/deploy.md.
#
# Every request goes through the Worker first (run_worker_first), so there is
# no public copy of the site. The PASSWORD secret survives deploys.

name = "birdtracker-password"
main = "password-worker.js"
compatibility_date = "2026-10-01"
workers_dev = false

routes = [
  { pattern = "birds.annajxli.com/*", zone_name = "annajxli.com" }
]

[assets]
directory = "../dashboard/dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "none"

# The recorder's media (clips, spectrograms, the near-live view), uploaded by
# pipeline/publish.py and served to signed-in visitors under /api/. Create the
# bucket before the first deploy that includes this (docs/deploy.md).
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "birdtracker-media"

# Sign-in rate limit per IP address (Workers' built-in limiter). namespace_id
# is any number unique to this account.
[[ratelimits]]
name = "SIGN_IN_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
