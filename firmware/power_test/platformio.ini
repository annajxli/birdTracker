; Bench test 2 firmware for the ESP32 boards. Pick the board in PlatformIO's
; environment switcher (status bar), then Build / Upload / Serial Monitor. See
; docs/plans/bench-test-2.md.

[platformio]
src_dir = .
default_envs = xiao_esp32s3, firebeetle

[env]
; pioarduino, because PlatformIO's own ESP32 platform is still on Arduino-ESP32
; 2.x, which lacks the ESP_I2S library the sketch uses.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_echo = yes  ; show what you type (l, c, i)

[env:xiao_esp32s3]
board = seeed_xiao_esp32s3
; Serial is the board's native USB port.
build_flags = -DBOARD_XIAO_ESP32S3 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:firebeetle]
board = dfrobot_firebeetle2_esp32e
build_flags = -DBOARD_FIREBEETLE
