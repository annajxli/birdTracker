# Filter and level meter
CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Microphone
CONFIG_I2S=y

# Commands over USB
CONFIG_CONSOLE_SUBSYS=y
CONFIG_CONSOLE_GETCHAR=y

# The mode survives a power cycle
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_REBOOT=y

CONFIG_MAIN_STACK_SIZE=2048
