; Build and flash the bench-test sketch from VS Code with the PlatformIO IDE
; extension. Pick the board in PlatformIO's environment switcher (status bar),
; then Build / Upload / Serial Monitor. See "Build the bench recorder" in
; docs/hardware.md.

[platformio]
src_dir = .
default_envs = firebeetle, pico2w

[env]
framework = arduino
monitor_speed = 115200
monitor_echo = yes  ; show what you type (l, r, u, i)

; FireBeetle 2 ESP32-E. pioarduino, because PlatformIO's own ESP32 platform is
; still on Arduino-ESP32 2.x, which lacks the ESP_I2S library the sketch uses.
[env:firebeetle]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = dfrobot_firebeetle2_esp32e
board_build.filesystem = littlefs

; Raspberry Pi Pico 2 W on the arduino-pico core (same core as the Arduino IDE).
[env:pico2w]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
board_build.core = earlephilhower
board_build.filesystem_size = 2m
; newlib-nano leaves %f out of printf unless asked; the sketch prints dBFS and kbit/s.
build_flags = -Wl,-u,_printf_float
